<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>birthday present</title>
<style>
:root{--bg:#fff;--fg:#0f1419;--sub:#536471;--line:#eff3f4;--accent:#f28c28;--like:#f91880;--rt:#00ba7c;--hover:#f7f9f9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#e7e9ea;--sub:#71767b;--line:#2f3336;--hover:#080808;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#e7e9ea;--sub:#71767b;--line:#2f3336;--hover:#080808;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.5}
.wrap{max-width:600px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--line);padding:10px 16px}
header b{font-size:20px;display:block}header span{font-size:13px;color:var(--sub)}
.cover{height:120px;background:linear-gradient(120deg,#ffb347,#ff7a3d 50%,#c2410c 78%,#7b2d4f)}
.prof{padding:0 16px 14px;border-bottom:1px solid var(--line)}
.prof .av{width:76px;height:76px;margin-top:-38px;border:4px solid var(--bg);font-size:38px}
.prof h1{margin:8px 0 0;font-size:20px}.prof p{margin:2px 0;color:var(--sub);font-size:15px}
.prof .bio{color:var(--fg);margin-top:8px}
.av{border-radius:50%;display:grid;place-items:center;flex:none;width:40px;height:40px;font-size:20px}
.post{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.post:hover{background:var(--hover)}
.body{min-width:0;flex:1}
.name{font-size:15px}.name b{margin-right:4px}.name span{color:var(--sub)}
.text{margin:2px 0 8px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;justify-content:space-between;max-width:420px;margin-left:-8px}
.acts button{all:unset;cursor:pointer;display:flex;align-items:center;gap:4px;color:var(--sub);font-size:13px;padding:6px 8px;border-radius:99px;font-variant-numeric:tabular-nums;min-width:52px}
.acts button:focus-visible{outline:2px solid var(--accent)}
.acts svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acts .rp:hover,.acts .rp.on{color:var(--rt)}
.acts .lk:hover,.acts .lk.on{color:var(--like)}
.acts .lk.on svg{fill:var(--like)}
.acts .rp.on svg{stroke-width:2.6}
.acts .rl:hover{color:var(--accent)}
.acts button.pop svg{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.acts button.pop svg{animation:none}}
.end{padding:32px 16px;text-align:center;color:var(--sub);font-size:14px}
.ask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20;padding:20px}
.ask[hidden]{display:none}
.card{background:var(--bg);color:var(--fg);border-radius:20px;padding:28px 22px;width:100%;max-width:360px;text-align:center}
.logo{display:inline-grid;grid-template-columns:auto auto;column-gap:3px;margin-bottom:18px;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.lh,.lx{font-size:46px;line-height:1;letter-spacing:-.02em}
.lh{font-weight:800;color:var(--fg)}
.lx{font-weight:900;padding:0 2px;background:linear-gradient(135deg,#ffb347,#c2410c);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{margin:0 0 6px;font-size:20px}
.card p.ltag{margin:-12px 0 18px;font-size:11px;letter-spacing:.14em;color:var(--sub);opacity:.8}.card p{margin:0 0 16px;color:var(--sub);font-size:14px}
.card input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);text-align:center}
.card input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.card button{margin-top:14px;width:100%;font:inherit;font-weight:700;padding:12px;border:0;border-radius:99px;background:var(--accent);color:#fff;cursor:pointer}
.note{display:block;margin-top:8px;font-size:12px;color:var(--sub)}
.chg{all:unset;cursor:pointer;color:var(--accent);font-size:13px;margin-top:6px;display:inline-block}
.chg:focus-visible{outline:2px solid var(--accent)}
.ask{background:linear-gradient(160deg,#ffb347,#ff7a3d 50%,#c2410c)!important}
body.asking .wrap{visibility:hidden}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:color-mix(in srgb,var(--accent) 12%,var(--bg));border-bottom:1px solid var(--line);font-size:14px}
.nudge[hidden]{display:none}
.nudge button{all:unset;cursor:pointer;background:var(--accent);color:#fff;font-weight:700;padding:8px 16px;border-radius:99px;white-space:nowrap}
.nudge button:focus-visible{outline:2px solid var(--fg)}
@keyframes fresh{from{background:color-mix(in srgb,var(--accent) 25%,var(--bg))}to{background:transparent}}
.post.fresh{animation:fresh 2s ease-out}
html,body{overscroll-behavior-y:contain}
.nudge button[hidden]{display:none}
.try{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;font-size:13px;color:var(--sub);border-bottom:1px solid var(--line)}
.try button{all:unset;cursor:pointer;flex:none;border:1px solid var(--accent);color:var(--accent);font-weight:700;font-size:13px;padding:6px 12px;border-radius:99px}
.try button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
body.gone{--bg:#fff;--fg:#222;--sub:#9a9a9a;--line:#eee;--hover:#fafafa;color-scheme:light}
body.gone .av{box-shadow:inset 0 0 0 1px #e6e6e6}
body.fading{background:#fff!important;transition:background 4.2s linear}
.wrap.vanish{pointer-events:none;animation:vanish 4.5s ease-in forwards}
.wrap.appear{animation:appear 3s ease-out}
@keyframes vanish{0%{opacity:1;filter:none}50%{opacity:.55;filter:blur(2px) brightness(1.3)}100%{opacity:0;filter:blur(12px) brightness(3)}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.wrap.vanish,.wrap.appear{animation:none}}
.rq{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-top:4px;color:var(--sub);font-size:12px;padding:4px 6px;border-radius:99px}
.rq svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rq:hover,.rq:focus-visible{color:var(--accent)}
#clear{background:rgba(255,255,255,.92)!important}
#clear .card{border:1px solid #ddd;color:#222}
#clear .card h2{font-size:28px;letter-spacing:.12em;margin:10px 0 6px;color:#222}
#clear .card button{background:#222;color:#fff}
#clear .card button.alt{background:transparent;color:#222;border:1px solid #bbb;margin-top:10px}
#rconf{background:rgba(255,255,255,.94)!important}
#rconf .card{border:1px solid #ddd;color:#222}
#rconf .card h2{margin:6px 0 10px;color:#222}
#rconf .card p{color:#444;margin:0 0 6px;line-height:1.7}
#rconf .card button{background:#222;color:#fff}
#rconf .card button.alt{background:transparent;color:#222;border:1px solid #bbb;margin-top:10px}
body.devil{--bg:#0a0a0a;--fg:#e8e8e8;--sub:#8a8a8a;--line:#262626;--hover:#111;color-scheme:dark}
.av.sm{width:28px;height:28px;font-size:14px}
.thread:empty{display:none}
.rep{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.rep .name{font-size:13px}.rep .text{margin:0}
.rbox{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.rto{font-size:12px;color:var(--sub);margin-bottom:4px}
.rbox textarea{width:100%;font:inherit;font-size:16px;background:var(--bg);color:var(--fg);border:0;outline:0;resize:none}
.rbox button{all:unset;cursor:pointer;display:block;margin-left:auto;background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:6px 16px;border-radius:99px}
.rbox button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#upd{background:rgba(0,0,0,.5)!important}
#upd .card h2{color:var(--accent);letter-spacing:.06em;margin-bottom:12px}
#upd .card p{color:var(--fg);margin:0 0 10px}
#upd .card p.updlist{background:var(--hover);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font-size:13px;line-height:1.7}
#ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;color:var(--sub);font-size:13px}
@media (prefers-reduced-motion:reduce){.post.fresh{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<div id="ptr"></div>
<div class="try"><span>名前を変えると、別のタイムラインが見られるよ！</span><button id="try">別の名前で試す！</button></div>
<header><b id="hname"></b><span id="hcount"></span></header>
<div class="cover"></div>
<div class="prof">
  <div class="av" id="pav"></div>
  <h1 id="pname"></h1>
  <p id="phandle"></p>
  <p class="bio" id="pbio"></p>
</div>
<div class="nudge" id="nudge"><span id="nudgetxt"></span><button id="rf">更新して！</button></div>
<main id="tl"></main>
<div class="end" id="end"></div>
</div>
<div class="ask" id="ask" hidden><div class="card">
<div class="logo" role="img" aria-label="HomeX"><span class="lh">Home</span><span class="lx">X</span></div>

<button id="updok">OK</button></div></div>
<div class="ask" id="clear" role="dialog" aria-labelledby="clrt" hidden><div class="card">

<button id="clearback">名前入力欄に戻る</button>
<button id="clearreset" class="alt">はじめから遊ぶ</button></div></div>

<button id="rconfno" class="alt">やめる</button></div></div>

const KEYS=[

["satou",["佐藤","知恩","さとう","ちおん","サトウ","チオン","Satou","Chion"]],
["komusubi",["小結","湊仁","こむすび","みなと","コムスビ","ミナト","Komusubi","Minato"]]];
const PROFILES={
furusawa:{suffix:"ちゃん",handle:"@star_on_stage",bio:"ミュージカルもお芝居も、いつも一生懸命🎭 頑張り屋さん🌹",icon:"🌹",iconBg:"#ffe3e8",accent:"#f28c28",cover:"linear-gradient(120deg,#ffb347,#ff7a3d 50%,#c2410c 78%,#7b2d4f)",end:"まだまだ褒めたりないけど、このへんで。ハートは何回でも押してね🧡",posts:[
  { who:"わたし", handle:"@me", icon:"😊", color:"#ffe6cc", time:"たった今", text:"{N}、誕生日おめでとう🎂🎉\nこれからも歌って、演じて、元気いっぱいに輝いてね。ずっと応援してる！", rp:99, lk:999, rl:27 },
  { who:"わたし", handle:"@me", icon:"😊", color:"#ffe6cc", time:"2時間", text:"{N}の歌声、ほんとに好き。\n聴いてると心がぎゅっとつかまれて、気づいたら泣いてたりする。歌がうまい人は多いけど、届く歌を歌える人は少ないんだよ。", rp:34, lk:420, rl:12 },
  { who:"客席の最前列", handle:"@front_row", icon:"🎭", color:"#ffe0d6", time:"3時間", text:"{N}の演技、役に入った瞬間に空気が変わる。\n目線ひとつ、指先ひとつまで物語になってて、ずっと見ていたくなる。", rp:58, lk:536, rl:14 },
  { who:"頑張り屋さん協会", handle:"@ganbariya_kyokai", icon:"🔥", color:"#ffe9c2", time:"4時間", text:"【認定】{N}を「頑張り屋さん」殿堂入りとします。\nミュージカルもお芝居も、どっちも全力。手を抜く姿を見たことがありません。", rp:71, lk:603, rl:16 },
  { who:"元気注入係", handle:"@genki_chuunyu", icon:"☀️", color:"#fff0c9", time:"5時間", text:"【速報】{N}が現れた瞬間、その場の元気が3割増しになりました。\nいつも元気いっぱいで、周りまでぱっと明るくなる。太陽みたいな人。", rp:47, lk:388, rl:9 },
  { who:"毛糸のおじさん", handle:"@keito_oji", icon:"🧶", color:"#f6e3d0", time:"8時間", text:"{N}が編むものは、目がきれいにそろってて、色づかいもかわいい。\n編み物が上手い人は、きっと心まで丁寧。", rp:21, lk:244, rl:6 },
  { who:"一生懸命ウォッチャー", handle:"@isshokenmei", icon:"💪", color:"#dff3ff", time:"10時間", text:"{N}って、何をやるにも一生懸命。\nうまくいかない日があっても、次の日にはまた全力で向き合ってる。その姿に何度も励まされてます。", rp:55, lk:472, rl:10 },
  { who:"稽古場の壁", handle:"@keikoba_wall", icon:"🎬", color:"#e8e0ff", time:"12時間", text:"稽古場の壁です。\n{N}が誰よりも真剣に、何度でも同じシーンに向き合ってるのを毎日見てます。舞台に向かう姿勢が本当にかっこいい。", rp:66, lk:571, rl:10 },
  { who:"ミュージカル好きの人", handle:"@musical_lover", icon:"🎶", color:"#f3dcee", time:"18時間", text:"歌も、ダンスも、お芝居も。\nミュージカルって大変なことだらけなのに、{N}はいつも楽しそうに全力でやりきる。ほんとにすごい。", rp:44, lk:398, rl:8 },
  { who:"努力を見てる人", handle:"@mite_ru", icon:"🌱", color:"#e3f5d2", time:"1日", text:"見えないところでこつこつ積み重ねてるの、みんな知ってるよ。\n{N}の上手さは、才能だけじゃなくて努力の結晶。えらい！", rp:52, lk:447, rl:8 },
  { who:"かわいい保安官", handle:"@kawaii_sheriff", icon:"⭐", color:"#ffe3ec", time:"1日", text:"{N}、かわいいが過ぎます。\n笑った顔も、真剣な顔も、ステージ上の顔も全部かわいい。逮捕します（いい意味で）。", rp:39, lk:402, rl:11 },
  { who:"舞台ファン", handle:"@butai_fan", icon:"🎟️", color:"#fde2d0", time:"2日", text:"{N}の演技を見てると、役のことをいっぱい考えてるのが伝わってくる。\n表情も間も、全部に理由があるみたいで、毎回「この人は役を生きてるんだな」って思わされる。", rp:36, lk:341, rl:7 }
]},
satou:{suffix:"くん",handle:"@rap_and_stage",bio:"ラップも歌もお芝居も。ポッドキャストも配信中🎙️",icon:"🍛",iconBg:"#fff0c9",accent:"#d98a1c",cover:"linear-gradient(120deg,#f6c23e,#d98a1c 55%,#7a4a12)",end:"まだまだ褒めたりないけど、このへんで。ハートは何回でも押してね🧡",posts:[
P("わたし","@me","😊","#ffe6cc","たった今","{N}、いつも本当にありがとう。\nこれからも全力で応援してる！",44,388,9),
P("ポッドキャスト中毒","@pod_addict","🎧","#dff3ff","3時間","{N}のポッドキャスト、ほんとに面白い。\nトークのテンポも、ちょっとした脱線も最高で、毎回更新が待ち遠しい。通勤中に笑いをこらえるのが大変です。",52,431,12),
P("真面目警察","@majime_police","🚓","#e3f5d2","6時間","{N}って、本当に真面目。\n与えられた課題には絶対に手を抜かないし、目の前のことにいつも一生懸命。そういうところ、めちゃくちゃ信頼できる。",31,267,5),
P("稽古場の壁","@keikoba_wall","🎬","#e8e0ff","10時間","芝居に向き合う{N}の熱量がすごい。\n誰よりも熱心で、同じシーンを何度でも掘り下げてる。見てるこっちも背筋が伸びます。",60,502,11),
P("客席の最前列","@front_row","🎭","#ffe0d6","1日","{N}の演技で泣いた。\nセリフじゃなく、気持ちがそのまま届いてくる感じ。人を感動させられる役者って、ほんとにすごい。",77,611,15),
P("歌好きの人","@uta_suki","🎶","#f3dcee","1日","{N}の歌、ずるいくらい上手い。\n声に芯があって、聴き終わったあともしばらく余韻が残る。",49,415,8),
P("ライブ帰り","@live_kaeri","🎤","#ffe9c2","2日","{N}のラップ、リズム感もライムも最高にかっこいい。\nリリースしたEPを何度も聴いてる。YouTubeでも、気づいたら同じ曲をリピートしちゃう。",83,689,14)
]},
komusubi:{suffix:"くん",handle:"@nail_and_dance",bio:"ネイルもダンスも剣道も。人狼も強い💅",icon:"💅",iconBg:"#ffe3f3",accent:"#b04ad8",cover:"linear-gradient(120deg,#ff9ad5,#c77dff 55%,#7b6bff)",end:"まだまだ褒めたりないけど、このへんで。ハートは何回でも押してね💜",posts:[
P("わたし","@me","😊","#ffe6cc","たった今","{N}、いつもありがとう。\nこれからもずっと応援してるよ！",39,356,8),
P("ファン代表","@fan_daihyo","💜","#f3dcee","4時間","{N}はファンのことを、いつも本気で考えてくれる。\nコメントもメッセージも、ちゃんと見てくれてるのが伝わる。応援してきてよかったって思わせてくれる人。",68,574,13),
P("多才すぎて困る","@tasai_sugi","🌟","#fff0c9","8時間","ダンスも剣道も、気づいたら何でもできちゃう{N}。\n才能が多すぎて、ちょっとうらやましい。まだ隠してる特技がある気がする。",54,449,10),
P("ダンス部の後輩","@dance_kohai","🕺","#dff3ff","12時間","{N}のダンス、キレがあって目が離せない。\n思わず見入っちゃう動きで、ずっと見ていたくなる。かっこいい。",41,333,7),
P("人狼村の住人","@jinro_mura","🐺","#e8e0ff","1日","人狼ゲームの{N}、観察力と話術が段違い。\n疑いを晴らす理由の組み立てが完璧で、毎回感心する。敵に回したくない（味方だと頼もしい）。",47,402,9),
P("努力を見てる人","@mite_ru","🌱","#e3f5d2","2日","{N}が努力してるの、みんな知ってるよ。\n見えないところで積み重ねて、ちゃんと結果を出す人。心から尊敬してる。",58,479,11),
P("ネイル研究会","@nail_lab","💅","#ffe3f3","2日","{N}のネイル、細かいところまで丁寧で、センスがすごい。\n男の人でここまで上手い人、なかなかいない。",72,611,16)
]},

$("#try").addEventListener("click",()=>{const grp=["furusawa","satou","komusubi"].includes(PK);clearAll();try{if(grp&&localStorage.getItem("tlupd")!=="done")localStorage.setItem("tlupd","pending")}catch(e){}location.reload()});
let taps=0,tapT;
$("header").addEventListener("click",()=>{taps++;clearTimeout(tapT);tapT=setTimeout(()=>{taps=0},2500);if(taps>=5){clearAll(true);location.reload()}});
$("#updok").addEventListener("click",()=>{$("#upd").hidden=true;$("#nm").focus()});
$("#clearback").addEventListener("click",()=>{clearAll();location.reload()});
$("#clearreset").addEventListener("click",()=>{$("#rconf").hidden=false;$("#rconfno").focus()});
$("#rconfno").addEventListener("click",()=>{$("#rconf").hidden=true;$("#clearback").focus()});
$("#rconfyes").addEventListener("click",()=>{clearAll(true);location.reload()});
render();
if(asked&&PK==="gone"&&!goneAnim)showClear();
if(!asked)openAsk();
try{if(!asked&&localStorage.getItem("tlupd")==="pending"){localStorage.setItem("tlupd","done");$("#upd").hidden=false;$("#updok").focus()}}catch(e){}
</script>
</body>
</html>
