<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>birthday present</title>
<style>
:root{--bg:#fff;--fg:#0f1419;--sub:#536471;--line:#eff3f4;--accent:#f28c28;--like:#f91880;--rt:#00ba7c;--hover:#f7f9f9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#e7e9ea;--sub:#71767b;--line:#2f3336;--hover:#080808;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#e7e9ea;--sub:#71767b;--line:#2f3336;--hover:#080808;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.5}
.wrap{max-width:600px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--line);padding:10px 16px}
header b{font-size:20px;display:block}header span{font-size:13px;color:var(--sub)}
.cover{height:120px;background:linear-gradient(120deg,#ffb347,#ff7a3d 50%,#c2410c 78%,#7b2d4f)}
.prof{padding:0 16px 14px;border-bottom:1px solid var(--line)}
.prof .av{width:76px;height:76px;margin-top:-38px;border:4px solid var(--bg);font-size:38px}
.prof h1{margin:8px 0 0;font-size:20px}.prof p{margin:2px 0;color:var(--sub);font-size:15px}
.prof .bio{color:var(--fg);margin-top:8px}
.av{border-radius:50%;display:grid;place-items:center;flex:none;width:40px;height:40px;font-size:20px}
.post{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.post:hover{background:var(--hover)}
.body{min-width:0;flex:1}
.name{font-size:15px}.name b{margin-right:4px}.name span{color:var(--sub)}
.text{margin:2px 0 8px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;justify-content:space-between;max-width:420px;margin-left:-8px}
.acts button{all:unset;cursor:pointer;display:flex;align-items:center;gap:4px;color:var(--sub);font-size:13px;padding:6px 8px;border-radius:99px;font-variant-numeric:tabular-nums;min-width:52px}
.acts button:focus-visible{outline:2px solid var(--accent)}
.acts svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acts .rp:hover,.acts .rp.on{color:var(--rt)}
.acts .lk:hover,.acts .lk.on{color:var(--like)}
.acts .lk.on svg{fill:var(--like)}
.acts .rp.on svg{stroke-width:2.6}
.acts .rl:hover{color:var(--accent)}
.acts button.pop svg{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.acts button.pop svg{animation:none}}
.end{padding:32px 16px;text-align:center;color:var(--sub);font-size:14px}
.ask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20;padding:20px}
.ask[hidden]{display:none}
.card{background:var(--bg);color:var(--fg);border-radius:20px;padding:28px 22px;width:100%;max-width:360px;text-align:center}
.card h2{margin:0 0 6px;font-size:20px}.card p{margin:0 0 16px;color:var(--sub);font-size:14px}
.card input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);text-align:center}
.card input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.card button{margin-top:14px;width:100%;font:inherit;font-weight:700;padding:12px;border:0;border-radius:99px;background:var(--accent);color:#fff;cursor:pointer}
.note{display:block;margin-top:8px;font-size:12px;color:var(--sub)}
.chg{all:unset;cursor:pointer;color:var(--accent);font-size:13px;margin-top:6px;display:inline-block}
.chg:focus-visible{outline:2px solid var(--accent)}
.ask{background:linear-gradient(160deg,#ffb347,#ff7a3d 50%,#c2410c)!important}
body.asking .wrap{visibility:hidden}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:color-mix(in srgb,var(--accent) 12%,var(--bg));border-bottom:1px solid var(--line);font-size:14px}
.nudge[hidden]{display:none}
.nudge button{all:unset;cursor:pointer;background:var(--accent);color:#fff;font-weight:700;padding:8px 16px;border-radius:99px;white-space:nowrap}
.nudge button:focus-visible{outline:2px solid var(--fg)}
@keyframes fresh{from{background:color-mix(in srgb,var(--accent) 25%,var(--bg))}to{background:transparent}}
.post.fresh{animation:fresh 2s ease-out}
html,body{overscroll-behavior-y:contain}
.nudge button[hidden]{display:none}
.try{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;font-size:13px;color:var(--sub);border-bottom:1px solid var(--line)}
.try button{all:unset;cursor:pointer;flex:none;border:1px solid var(--accent);color:var(--accent);font-weight:700;font-size:13px;padding:6px 12px;border-radius:99px}
.try button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
body.scary{--bg:#000;--fg:#a8a8a8;--sub:#7a1c1c;--line:#240000;--hover:#050000;--like:#600;--rt:#600;color-scheme:dark}
body.scary::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;background:radial-gradient(ellipse at center,transparent 35%,#000 105%)}
body.scary .wrap{border-color:#200}
body.scary .av{box-shadow:0 0 0 1px #300,0 0 14px #3a0000}
body.scary #pname,body.scary #hname{color:#b00;animation:glitch 3.2s infinite}
body.scary .text{color:#c40000;letter-spacing:.08em;text-shadow:0 0 6px #500;animation:flick 5s infinite}
body.scary .post.fresh{animation:dread 3.5s}
body.scary .acts{opacity:.45}
body.scary .try,body.scary .nudge{background:#070000;color:#7a1c1c}
@keyframes glitch{0%,90%,100%{transform:none;text-shadow:none}92%{transform:translateX(-3px);text-shadow:3px 0 #f00,-3px 0 #444}95%{transform:translateX(3px);text-shadow:-3px 0 #f00}}
@keyframes flick{0%,88%,100%{opacity:1}90%{opacity:.15}92%{opacity:1}95%{opacity:.35}97%{opacity:1}}
@keyframes dread{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){body.scary *{animation:none!important}}
#ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;color:var(--sub);font-size:13px}
@media (prefers-reduced-motion:reduce){.post.fresh{animation:none}}
</style>
</head>

  { who:"わたし", handle:"@me", icon:"😊", color:"#ffe6cc", time:"たった今", text:"{N}、誕生日おめでとう🎂🎉\nこれからも歌って、演じて、元気いっぱいに輝いてね。ずっと応援してる！", rp:99, lk:999, rl:27 },

 $(".cover").style.background=PR.cover;
 $("#pav").style.background=PR.iconBg;$("#pav").textContent=PR.icon;
 $("#hname").textContent=N;$("#hcount").textContent=PK==="yuuka"?"…":sh+"件のポスト";
 $("#pname").textContent=N;$("#phandle").textContent=PR.handle;$("#pbio").textContent=PR.bio;
 $("#nudge").hidden=done;
 $("#nudgetxt").textContent=PR.nudge||defNudge;
 $("#end").textContent=done?PR.end:"";
 $("#tl").innerHTML=POSTS.map((p,i)=>({p,i})).slice(start).map(({p,i})=>{
  const s=saved[PK+i]||{};
  const btn=(k,label)=>`<button class="${k}${s[k+"On"]?" on":""}" data-i="${i}" data-k="${k}" aria-label="${label}"><svg viewBox="0 0 24 24">${icons[k]}</svg><span>${fmt(p[k]+(s[k]||0))}</span></button>`;
  return `<article class="post${i===start&&sh>1?" fresh":""}"><div class="av" style="background:${p.color}">${p.icon}</div><div class="body">
  <div class="name"><b>${esc(p.who)}</b><span>${esc(p.handle)} ・ ${p.time}</span></div>
  <div class="text">${esc(p.text).split("{N}").join(esc(N))}</div>
  <div class="acts">${btn("rl","返信")}${btn("rp","リポスト")}${btn("lk","いいね")}</div></div></article>`}).join("");
}
$("#tl").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 const i=b.dataset.i,k=b.dataset.k,key=PK+i;
 saved[key]=saved[key]||{};saved[key][k]=(saved[key][k]||0)+1;saved[key][k+"On"]=true;save();
 b.classList.add("on");b.querySelector("span").textContent=fmt(POSTS[i][k]+saved[key][k]);
 b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");
});
function openAsk(){document.body.classList.add("asking");$("#ask").hidden=false;$("#nm").value=myName;setTimeout(()=>$("#nm").focus(),50)}
function submitName(){
 myName=$("#nm").value.trim().slice(0,20);
 try{localStorage.setItem("tlname",myName)}catch(e){}
 $("#ask").hidden=true;document.body.classList.remove("asking");render();
}
$("#go").addEventListener("click",submitName);
$("#nm").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)submitName()});
$("#chg").addEventListener("click",openAsk);
const touch=matchMedia("(pointer:coarse)").matches;
const defNudge=touch?"👇 画面を下にスワイプして更新すると、新しいつぶやきが届くよ！":"🔄 ページを更新すると、新しいつぶやきが届くよ！";
$("#rf").hidden=touch;
function more(){if(shown>=POSTS.length)return;shown++;try{localStorage.setItem("tlshown",shown)}catch(e){}render();const n=document.querySelector(".post.fresh");if(n)n.scrollIntoView({behavior:"smooth",block:"center"})}
$("#rf").addEventListener("click",more);
let y0=null,dy=0;const ptr=$("#ptr");
addEventListener("touchstart",e=>{if(scrollY<=0&&$("#ask").hidden&&shown<POSTS.length){y0=e.touches[0].clientY;dy=0}else y0=null},{passive:true});
addEventListener("touchmove",e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy>0&&scrollY<=0){e.preventDefault();const h=Math.min(dy*.5,64);ptr.style.height=h+"px";ptr.textContent=h>=48?"離すと更新 🔄":"↓ 引っ張って更新"}else{ptr.style.height="0px"}},{passive:false});
addEventListener("touchend",()=>{if(y0===null)return;const go=dy*.5>=48;y0=null;ptr.style.transition="height .25s";ptr.style.height="0px";ptr.textContent="";setTimeout(()=>{ptr.style.transition="";if(go)more()},250)});
$("#try").addEventListener("click",()=>{clearAll();location.reload()});
let taps=0,tapT;
$("header").addEventListener("click",()=>{taps++;clearTimeout(tapT);tapT=setTimeout(()=>{taps=0},2500);if(taps>=5){clearAll();location.reload()}});
render();
if(!asked)openAsk();
</script>
</body>
</html>
